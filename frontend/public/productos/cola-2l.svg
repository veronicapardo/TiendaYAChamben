<svg width="500" height="700" viewBox="0 0 500 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Botella de cola 2 litros</title>
  <desc id="desc">Ilustración SVG de una botella genérica de cola para producto de tienda.</desc>

  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="0.18" stop-color="#ffffff" stop-opacity="0.65"/>
      <stop offset="0.36" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="0.62" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.35"/>
    </linearGradient>

    <linearGradient id="cola" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2b0904"/>
      <stop offset="0.28" stop-color="#5b160b"/>
      <stop offset="0.5" stop-color="#8b2a12"/>
      <stop offset="0.75" stop-color="#4a0d06"/>
      <stop offset="1" stop-color="#190402"/>
    </linearGradient>

    <linearGradient id="labelRed" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b9090f"/>
      <stop offset="0.25" stop-color="#e42626"/>
      <stop offset="0.5" stop-color="#ff3535"/>
      <stop offset="0.78" stop-color="#c90b15"/>
      <stop offset="1" stop-color="#8f050b"/>
    </linearGradient>

    <linearGradient id="cap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#333333"/>
      <stop offset="1" stop-color="#050505"/>
    </linearGradient>

    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.22"/>
    </filter>

    <clipPath id="bottleClip">
      <path d="M216 96 C216 74 284 74 284 96 L284 152 C284 174 315 194 326 237 C342 300 337 408 323 474 C314 518 317 573 342 626 C350 642 338 658 319 658 L181 658 C162 658 150 642 158 626 C183 573 186 518 177 474 C163 408 158 300 174 237 C185 194 216 174 216 152 Z"/>
    </clipPath>
  </defs>

  <rect width="500" height="700" fill="#ffffff"/>
  <ellipse cx="250" cy="665" rx="115" ry="20" fill="#000000" opacity="0.10"/>

  <g filter="url(#shadow)">
    <!-- Cola liquid -->
    <path d="M216 134 C216 116 284 116 284 134 L284 158 C284 178 312 199 323 241 C338 302 332 406 320 470 C311 516 315 571 338 620 C344 632 335 645 318 645 L182 645 C165 645 156 632 162 620 C185 571 189 516 180 470 C168 406 162 302 177 241 C188 199 216 178 216 158 Z" fill="url(#cola)"/>

    <!-- Bottle outer glass -->
    <path d="M216 96 C216 74 284 74 284 96 L284 152 C284 174 315 194 326 237 C342 300 337 408 323 474 C314 518 317 573 342 626 C350 642 338 658 319 658 L181 658 C162 658 150 642 158 626 C183 573 186 518 177 474 C163 408 158 300 174 237 C185 194 216 174 216 152 Z" fill="url(#glass)" stroke="#d7d7d7" stroke-width="3" opacity="0.9"/>

    <!-- Neck highlights -->
    <path d="M226 92 C236 85 264 85 274 92 L274 184 C268 176 260 172 250 172 C240 172 232 176 226 184 Z" fill="#ffffff" opacity="0.22"/>
    <path d="M200 202 C190 224 184 260 182 302" stroke="#ffffff" stroke-width="9" opacity="0.38" stroke-linecap="round"/>
    <path d="M300 205 C316 248 318 330 308 406" stroke="#ffffff" stroke-width="7" opacity="0.20" stroke-linecap="round"/>

    <!-- Cap -->
    <g>
      <rect x="212" y="48" width="76" height="52" rx="11" fill="url(#cap)"/>
      <rect x="211" y="48" width="78" height="14" rx="6" fill="#1b1b1b"/>
      <g opacity="0.38" stroke="#777" stroke-width="2">
        <line x1="220" y1="55" x2="220" y2="96"/>
        <line x1="232" y1="55" x2="232" y2="96"/>
        <line x1="244" y1="55" x2="244" y2="96"/>
        <line x1="256" y1="55" x2="256" y2="96"/>
        <line x1="268" y1="55" x2="268" y2="96"/>
        <line x1="280" y1="55" x2="280" y2="96"/>
      </g>
    </g>

    <!-- Label -->
    <g clip-path="url(#bottleClip)">
      <path d="M151 304 C198 292 302 292 349 304 L349 438 C304 450 196 450 151 438 Z" fill="url(#labelRed)"/>
      <path d="M151 396 C202 432 290 422 350 365" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" opacity="0.92"/>
      <path d="M153 412 C214 446 304 430 350 389" fill="none" stroke="#7a0308" stroke-width="5" stroke-linecap="round" opacity="0.35"/>
      <circle cx="322" cy="353" r="5" fill="#ffffff" opacity="0.85"/>
      <circle cx="338" cy="371" r="4" fill="#ffffff" opacity="0.75"/>
      <circle cx="310" cy="388" r="3" fill="#ffffff" opacity="0.55"/>
      <circle cx="333" cy="405" r="3" fill="#ffffff" opacity="0.6"/>
    </g>

    <!-- Label text -->
    <text x="250" y="342" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#ffffff" letter-spacing="2">CLASSIC</text>
    <text x="250" y="360" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#ffffff" letter-spacing="1.5">REFRESHING TASTE</text>
    <text x="250" y="408" text-anchor="middle" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="66" font-style="italic" fill="#ffffff" stroke="#2c0205" stroke-width="3" paint-order="stroke fill">COLA</text>
    <text x="250" y="464" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="800" fill="#ffffff">2 LITER</text>

    <!-- Bottom bottle details -->
    <g opacity="0.30" fill="#ffffff">
      <path d="M197 610 C212 646 218 646 228 610 C218 618 207 618 197 610 Z"/>
      <path d="M239 612 C245 650 255 650 261 612 C254 619 246 619 239 612 Z"/>
      <path d="M272 610 C282 646 288 646 303 610 C293 618 282 618 272 610 Z"/>
    </g>
  </g>
</svg>
